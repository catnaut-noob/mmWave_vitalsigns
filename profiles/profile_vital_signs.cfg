% ============================================================================
% Vital Signs (breathing / heart rate) demo configuration for xWRL6844EVM.
%
% This config selects the *vital signs* data path branch via 'dataPathMode 1'.
% Use the regular point cloud profiles (dataPathMode defaults to 0, or set it
% explicitly to 0) to run the classic detection chain instead.
%
% Vital signs requires a (near-)stationary subject. For initial bring-up the
% target range bin can be fixed with 'vitalSignsCfg 1 <rangeBin>'. Setting the
% manual-enable flag to 0 lets the firmware auto-locate the subject. When the
% group tracker is enabled (trackingCfg ... 1 ...), the auto mode locks onto
% the first tracked target; otherwise it falls back to the strongest point.
% The tracker also streams target list (TLV 1010) and target index (TLV 1011).
% ============================================================================
sensorStop 0
channelCfg 153 255 0
apllFreqShiftEn 0
chirpComnCfg 8 0 0 256 1 13.1 3
chirpTimingCfg 6 63 0 160 58
adcDataDitherCfg 1
frameCfg 64 0 1358 1 100 0
gpAdcMeasConfig 0 0
guiMonitor 1 1 0 0 0 1
% Select the vital signs data path branch (0 = point cloud, 1 = vital signs)
dataPathMode 1
% <manualRangeBinEnable> <rangeBin>: 0 = auto-locate target from point cloud
vitalSignsCfg 0 0
cfarProcCfg 0 2 8 4 3 0 9.0 0
cfarProcCfg 1 2 4 2 2 1 9.0 0
cfarFovCfg 0 0.25 9.0
cfarFovCfg 1 -20.16 20.16
aoaProcCfg 64 64
aoaFovCfg -60 60 -60 60
clutterRemoval 0
% ---------------- Group tracker (gtrack 3D) ----------------
% sensorPosition <xOff> <yOff> <zOff> <azimuthTilt> <elevationTilt>
sensorPosition 0 0 1.1 0 0
% boundaryBox <Xmin> <Xmax> <Ymin> <Ymax> <Zmin> <Zmax> : points outside are dropped
boundaryBox -2 2 0 4 -0.5 3
% staticBoundaryBox : region where static targets are allowed to persist
staticBoundaryBox -1 1 0.5 3 0 3
% presenceBoundaryBox : presence-detection region
presenceBoundaryBox -1 1 0.5 3 0 3
% gatingParam <gain> <width> <depth> <height> <vel>
gatingParam 3 2 2 2 4
% stateParam <det2act> <det2free> <act2free> <stat2free> <exit2free> <sleep2free>
stateParam 3 3 12 200 5 200
% allocationParam <snr> <snrObscured> <velocity> <points> <maxDistance> <maxVel>
allocationParam 6 10 0.0001 4 2.5 20
% maxAcceleration <maxXacc> <maxYacc> <maxZacc>
maxAcceleration 1.5 1.5 1.5
% trackingCfg <enable> <paramSet> <numPoints> <numTracks> <maxDoppler> <framePeriod>
trackingCfg 1 2 100 1 100 100
% -----------------------------------------------------------
factoryCalibCfg 1 0 44 2 0x1ff000
runtimeCalibCfg 1
antGeometryBoard xWRL6844EVM
adcDataSource 0 adc_test_data_0001.bin
adcLogging 0
lowPowerCfg 0
sensorStart 0 0 0 0
